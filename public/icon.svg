<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Ledger Book Spine & Pages -->
  <rect x="110" y="110" width="292" height="292" rx="28" fill="#1e293b" />
  <rect x="120" y="120" width="272" height="272" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  
  <!-- Left Spine Accent -->
  <rect x="120" y="120" width="36" height="272" rx="8" fill="url(#accentGrad)" />

  <!-- Book Lines -->
  <line x1="180" y1="180" x2="350" y2="180" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <line x1="180" y1="230" x2="330" y2="230" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <line x1="180" y1="280" x2="350" y2="280" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>

  <!-- Rupee Symbol / Badge in Gold -->
  <circle cx="310" cy="325" r="54" fill="url(#goldGrad)" filter="drop-shadow(0 4px 12px rgba(245,158,11,0.4))"/>
  <text x="310" y="343" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#020617" text-anchor="middle">Rs</text>

  <!-- Mobile phone small symbol inside badge -->
  <rect x="180" y="325" width="26" height="42" rx="5" fill="none" stroke="#10b981" stroke-width="4"/>
  <circle cx="193" cy="358" r="2" fill="#10b981"/>
</svg>
